<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>成本库 SQL 参数生成器 · 20260910</title>
<style>body{max-width:800px;margin:36px auto;padding:20px;font:16px/1.8 system-ui;color:#23354b}label,a{display:block;margin:14px 0}input,button{font:inherit;padding:8px}#error{color:#b91c1c}</style>
<h1>成本库 SQL 参数生成器</h1>
<p>仅生成副本，不联网、不执行数据库。先确认 cost 后端实际连接的成本 schema；数据库名不等于 schema。</p>
<label>成本 schema <input id="schema" placeholder="例如 public 或 costree_mvp"></label>
<label>实际租户 ID <input id="tenant" inputmode="numeric" placeholder="例如 124"></label>
<button id="generate">生成 SQL 下载链接</button><p id="error"></p><div id="downloads"></div>
<p>通常执行 01 完整升级 → 03 核对。02 只补缺表、不补已有表缺列；04 仅适用于其余升级已完成且单独缺 revision。05 仅适用于此前完整升级已完成的库，扩展类别和平台/系列字段。不要全部重复执行。遇首条 ERROR 停止并回滚，保留错误，不清 migration。</p>
<script>
const templates=/*SQL_TEMPLATES*/{};
let urls=[];
function render(schema,tenant){
  if(!/^[A-Za-z_][A-Za-z0-9_]{0,62}$/.test(schema))throw Error('schema 仅支持 1–63 位字母数字下划线，首位不能为数字；复杂名称请交 DBA 核实后手工设置。');
  if(!/^(0|[1-9][0-9]{0,18})$/.test(tenant)||BigInt(tenant)>9223372036854775807n)throw Error('租户 ID 必须是有效的非负 bigint 整数。');
  return Object.fromEntries(Object.entries(templates).map(([name,sql])=>{
    const matches=sql.match(/SET (?:LOCAL )?search_path TO "public";/g)||[];
    if(matches.length!==1)throw Error('SQL search_path 模板不一致：'+name);
    sql=sql.replace(/(SET (?:LOCAL )?search_path TO )"public";/,'$1"'+schema+'";');
    if(name==='01-full-upgrade.sql'){
      if((sql.match(/tenant_id=124\b/g)||[]).length!==1)throw Error('租户检查模板不一致');
      sql=sql.replace(/tenant_id=124\b/,'tenant_id='+tenant);
    }
    return [name,sql];
  }));
}
document.getElementById('generate').onclick=()=>{
  document.getElementById('error').textContent='';
  const downloads=document.getElementById('downloads');downloads.replaceChildren();urls.forEach(URL.revokeObjectURL);urls=[];
  try{const files=render(document.getElementById('schema').value.trim(),document.getElementById('tenant').value.trim());
    for(const [name,text] of Object.entries(files)){const a=document.createElement('a');a.download=name;a.textContent='下载 '+name;a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));urls.push(a.href);downloads.appendChild(a);}
  }catch(e){document.getElementById('error').textContent=e.message;}
};
</script></html>
