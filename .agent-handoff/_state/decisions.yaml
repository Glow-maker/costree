items:
- decision_id: DEC-001
  summary: 成本库作为业务中台内嵌模块建设，不做独立系统。
  rationale: 复用业务中台登录、租户、权限、菜单、组织、消息、导入导出和网关能力，降低集成和运维成本。
  time: '2026-06-12T00:15:17+08:00'
- decision_id: DEC-002
  summary: Figma/React 原型只作为页面和交互参考，最终按 Vue3 + Yudao 后端规范重写。
  rationale: 业务中台前端技术栈为 Vue3，直接嵌 React 原型会增加集成和维护风险。
  time: '2026-06-12T00:15:17+08:00'
- decision_id: DEC-003
  summary: 后端采用 yudao-module-cost + cost-server 独立服务接入业务中台。
  rationale: 便于成本库独立启动、注册到 Nacos，并通过网关按 /admin-api/cost/** 访问。
  time: '2026-06-12T00:15:17+08:00'
- decision_id: DEC-004
  summary: 成本库默认使用业务中台真实登录态，VITE_COST_MOCK_LOGIN 只用于独立调试。
  rationale: 避免前端代理注入 login-user 覆盖真实用户、角色、租户和数据权限，保证权限验收可信。
  time: '2026-06-12T00:15:17+08:00'
- decision_id: DEC-005
  summary: 涉及真实数据量的列表和明细默认后端分页，禁止先查全量再手动分页。
  rationale: 待分配池、预警中心、目录工作令等页面未来数据量可能很大，需要从设计上避免加载慢和内存压力。
  time: '2026-06-12T00:15:17+08:00'
- decision_id: DEC-006
  summary: 真实内网库不得执行 seed-mvp.sql。
  rationale: seed-mvp.sql 只用于外网测试库构造样本，真实库执行会覆盖或污染内网真实数据。
  time: '2026-06-12T00:15:17+08:00'
- decision_id: DEC-007
  summary: 长期项目按活文档机制维护：note 作为项目事实源，.agent-handoff 作为快速恢复层。
  rationale: 成本库项目会持续多轮开发，新会话和后续维护者不能依赖聊天记录。后续开发前必须先读文档中心，开发后做状态更新和经验沉淀；文档保持短、准、可执行，避免复制散落。
  time: '2026-06-12T01:51:08+08:00'
- decision_id: DEC-008
  summary: 成本库默认只按模块边界开发，修改其他模块必须先通知并文档留痕。
  rationale: 成本库嵌入既有业务中台，随意修改非成本模块会增加回归风险和责任边界不清。后续如确需触碰其他模块，必须说明原因、影响范围、是否临时和回归方式。
  time: '2026-06-12T19:07:05+08:00'
- decision_id: DEC-009
  summary: 成本服务离线包不提交到 root Git 仓库，只保留本地目录和 zip 作为部署介质。
  rationale: 离线包包含 120MB+ 的可执行 jar/zip，大二进制不适合进入源码仓库；root 仓库继续只承载项目文档、交接状态和忽略规则。
  time: '2026-06-18T02:23:27+08:00'
- decision_id: DEC-010
  summary: PostgreSQL seed 只用于测试验证环境，真实内网库只执行 DDL 后导入真实数据。
  rationale: 测试 seed 用于复现外网样例和页面路径，正式环境执行会污染真实数据；真实数据导入需按内网租户、组织和数据权限写入。
  time: '2026-06-18T02:23:27+08:00'
- decision_id: DEC-011
  summary: 成本库当前操作指南和协作文档默认使用 <costree-root>、<frontend-root>、<backend-root> 与相对路径，不写死本机盘符。
  rationale: '文档需要在内网、陵台计算机和不同开发机之间复用；写死 H:、D: 或个人用户目录会导致接管 prompt、部署命令和文件引用不可执行。'
  time: '2026-06-18T02:37:52+08:00'
- decision_id: DEC-012
  summary: 内网三张原表不直接作为成本库页面业务表使用，先映射到成本库业务表。
  rationale: 原表字段全是字符串且口径来自源系统，缺少成本库页面需要的目标成本、阶段、分系统、展示树节点类型等字段；直接使用会让页面逻辑和源表结构强耦合。
  time: '2026-06-22T00:04:53+08:00'
- decision_id: DEC-013
  summary: cost_model_node 和 cost_project 继续分开维护。
  rationale: cost_model_node 负责左侧领域-系列-型号展示树，cost_project 负责项目卡片、项目详情、成本树和工作令关联；这样内网项目树层级变化时不会直接破坏业务项目锚点。
  time: '2026-06-22T00:04:53+08:00'
- decision_id: DEC-014
  summary: 账面成本优先由 cost_work_order_ledger_detail 聚合，目标成本和阶段等业务字段由 cost_work_order
    维护。
  rationale: 账面明细是凭证明细来源，但不包含目标成本、阶段、分系统等填报字段；预警需要账面成本和目标成本同时存在。
  time: '2026-06-22T00:04:53+08:00'
- decision_id: DEC-015
  summary: 项目办填报的是否产品附件/发射车字段直接存中文值，不新增独立字典表。
  rationale: 当前 /cost/collect 的用户、获取方式等字典也采用前端固定下拉和中文值保存；本字段值域小且稳定，先按同一方式实现，降低实施复杂度。
  time: '2026-06-26T10:24:02+08:00'
- decision_id: DEC-016
  summary: 承研单位使用 cost_unit_dict 作为下拉来源。
  rationale: 承研单位属于单位口径数据，直接手输容易产生名称不一致；用成本库单位字典可与后续单位成本、工作令和权限口径保持一致。
  time: '2026-06-26T10:24:02+08:00'
- decision_id: DEC-017
  summary: 多单位树详情默认采用单位矩阵视图，保留原树图作为可选视图。
  rationale: 当单位超过 7 家时树图横向滚动成本高，矩阵更适合扫读和点击穿透；少单位场景仍保留树状连线展示。
  time: '2026-06-26T10:24:02+08:00'
- decision_id: DEC-018
  summary: 院内单位展示和预警以管理单位简称为口径，实际核算单位仅在穿透层保留。
  rationale: 多个核算单位可能同属电子所等管理单位，管理层展示需要合并，但账面明细和工作令查询仍必须保留实际单位以避免错误合并。
  time: '2026-07-21T19:36:08+08:00'
- decision_id: DEC-019
  summary: 管理单位分类由 cost_unit_dict.manage_unit_group 显式维护。
  rationale: 总体所、总装所、专业所、基础所的业务分类不能仅靠名称猜测；显式字典字段便于内网同步和后续维护，缺失值进入未分类。
  time: '2026-07-21T19:36:08+08:00'
- decision_id: DEC-020
  summary: 单位使用率排名只纳入院内管理单位，使用率按账面成本除以目标成本计算。
  rationale: 院外单位当前没有权威账面成本口径，纳入排名会产生无意义的 0% 或错误比较。
  time: '2026-07-21T19:36:08+08:00'
