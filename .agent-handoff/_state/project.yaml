- 发布目录 cost-intranet-data-kit 被根仓库 .gitignore 忽略，内容已落盘并通过 SHA256/验包，但不会自动进入普通 Git
  提交。
- 当前三个仓库还包含前序已批准但未提交的成本功能和交接状态变更，本轮没有提交或推送。
