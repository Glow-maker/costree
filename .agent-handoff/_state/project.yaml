- 内网真实 MySQL、Redis、Nacos、网关、菜单权限、组织和数据权限映射仍待内网环境确认。
- 真实内网库不得执行 seed-mvp.sql；测试数据只用于外网测试库。
- 当前前端、后端和文档仓库均有本轮未提交变更；后端 application-local.yml 的本地 Nacos discovery 配置提交前需确认是否纳入版本。
