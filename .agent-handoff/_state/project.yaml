current_phase: 第一阶段 MVP 实现、真实数据对齐和内网部署准备收口中
current_goal: 在已有业务中台中嵌入成本库/成本树业务模块，让成本库数据可进入、可维护、可查询、可控权限，并用 note 文档中心和 .agent-handoff
  形成可持续接管、开发、收尾和经验沉淀机制。
summary: 本轮在上一版逻辑工作令基础上完成项目展示和账面穿透收尾：项目详情改为顶部项目基本情况、单位成本和工作令维护；首页账面组成可进入领域级借方明细并导出；采集页字段标签增加悬停说明。成本树与单位穿透页统一按阶段集合完整匹配，C/Z
  工作令只有同时选择 C 和 Z 才展示；单位页补充到款、工作令编号、目标和合同信息，组成弹窗修复重复打开后图表丢失问题，并可继续穿透和导出原始明细。后端新增工作令八项组成汇总
  Excel 导出及 PostgreSQL 既有库升级、前置检查和验收脚本。前端提交 f78d9c0 已推送 codeup/feature/costree2，后端提交
  1f245334 已推送 codeup/feature/costree。
next_step: 内网升级前按 baback/sql/postgresql/costree-deploy/README.md 构建并校验交付包，先备份、执行 00-precheck.sql，确认通过后执行
  10-upgrade-existing-to-20260722.sql，最后执行 20-verify.sql。升级完成后使用真实登录态回归 C、Z、C+Z 阶段组合，连续打开工作令组成弹窗至少
  5 次，并核对组成明细导出和工作令八项组成汇总导出。
blockers:
- 现有数据库升级不能只替换 jar；必须执行 costree-deploy 中的前置检查、升级和验证脚本，否则可能出现缺列、旧唯一约束或逻辑工作令重复问题。
- 升级前置检查若发现同一逻辑工作令固定金额冲突，会主动终止，需要业务先确认权威值。
- 本机没有可用的 psql/mysql 命令，本轮未在真实数据库执行 PostgreSQL 升级包；现场仍需按 20-verify.sql 验收。
- 自动化浏览器缺少业务登录态，阶段组合、弹窗连续打开、导出文件内容和权限仍需登录环境完成最终交互回归。
- 真实内网 Nacos、数据库、Redis、网关、菜单权限、租户、组织和数据权限映射仍待现场确认。
