current_phase: 第一阶段 MVP 实现、真实数据对齐和内网部署准备收口中
current_goal: 在已有业务中台中嵌入成本库/成本树业务模块，让成本库数据可进入、可维护、可查询、可控权限，并用 note 文档中心和 .agent-handoff
  形成可持续接管、开发、收尾和经验沉淀机制。
summary: 本轮完成 /cost/project-detail 项目维护改造：顶部保留工作令数量、目标成本、账面成本和院内执行率，主体拆为项目基本情况、单位成本信息、工作令基础信息三个标签；项目基本情况和工作令可按状态弹窗维护，单位金额保持预分预控同步只读。工作令调整为租户+项目+实际单位+工作令编号一条逻辑记录，年度只保留在账面明细，跨年度借方明细重算为工作令账面快照；新增工作令到款金额，合同、到款、目标和审定仅用于工作令层核对，不进入首页、型号树和单位汇总。账面组成详情默认汇总全部年度，单位穿透页移除年度展开。后端提交
  747d6e25 已推送 codeup/feature/costree，前端提交 56acad9 已推送 codeup/feature/costree2。
next_step: 现有数据库按顺序执行对应方言的 20260721 manage_unit_group 迁移和 20260722 logical_work_order
  迁移，重启后端并使用有真实登录态的前端验证 /cost/project-detail、/cost/tree-unit-detail 和账面组成详情。迁移前先运行固定金额冲突检查；若有冲突，先由业务确认保留值，再继续合并旧年度工作令。
blockers:
- 现有数据库必须执行 costree-cost-20260722-logical-work-order.sql；否则 income_amount 缺列且旧年度工作令唯一键仍不符合新逻辑。
- 20260722 迁移前置检查若发现同一逻辑工作令的合同、到款、目标或审定金额冲突，会主动终止，需要先人工确认权威值。
- 20260721 manage_unit_group 迁移尚未执行的环境必须先执行该脚本；新建数据库直接使用最新完整 DDL，不重复跑增量脚本。
- 本机没有可用的 psql/mysql 命令，本轮未对真实数据库执行迁移；数据库迁移结果仍需现场验证。
- 自动化浏览器缺少业务登录态，项目详情弹窗、状态权限和跨年度账面穿透仍需登录环境完成最终视觉与交互回归。
- 真实内网 Nacos、数据库、Redis、网关、菜单权限、租户、组织和数据权限映射仍待现场确认。
