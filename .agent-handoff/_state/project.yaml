  AGENTS、工程经验手册、PROJECT_STATE、DECISIONS 和变更日志。
next_step: 继续项目时先运行 agent-handoff resume，再阅读 note/PROJECT_STATE.md 和 note/PLAN.md。下一步最小任务仍是迁移原型
  DataAnalysis.tsx 为 /cost/analysis 第一版；开发时必须遵守模块边界，默认只改成本库/成本树相关文件。
