<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <desc>成本树项目完整架构图，展示成本树平台接入数据中台后的入口、采集、源数据、锚定、汇总建树、预警、数据存储与治理闭环。</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfcff"/>
      <stop offset="100%" stop-color="#f3f7fc"/>
    </linearGradient>
    <linearGradient id="blueSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f9fcff"/>
    </linearGradient>
    <linearGradient id="greenSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f8fffb"/>
    </linearGradient>
    <linearGradient id="purpleSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0ff"/>
      <stop offset="100%" stop-color="#fcfaff"/>
    </linearGradient>
    <linearGradient id="orangeSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,2 L10,6 L1.5,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,2 L10,6 L1.5,10 Z" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,2 L10,6 L1.5,10 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5,2 L8,5 L1.5,8 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 46px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; fill: #536173; }
      .section { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #111827; }
      .cardTitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; font-weight: 800; fill: #172033; }
      .cardSub { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; fill: #536173; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #64748b; }
      .tiny { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .badgeText { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; }
      .pillText { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #334155; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #2563eb; }
      .orangeLabel { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #ea580c; }
      .greenLabel { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #059669; }
      .mono { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 14px; fill: #334155; font-weight: 700; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#pageBg)"/>
  <rect x="34" y="38" width="1852" height="1004" rx="28" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Header -->
  <text x="72" y="98" class="title">成本树项目完整架构图</text>
  <text x="72" y="134" class="subtitle">成本树平台接入数据中台后的采集、汇总、预警、权限与审计闭环</text>
  <rect x="1180" y="62" width="446" height="68" rx="16" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="1208" y="91" class="small">当前口径：Vue3 中台前端 + yudao-module-cost 后端</text>
  <text x="1208" y="116" class="small">MVP 聚焦数据可进入、可维护、可查询、可控权限</text>

  <!-- Work area and governance sidebar -->
  <rect x="62" y="164" width="1566" height="744" rx="24" fill="#fbfdff" stroke="#e6edf7"/>
  <text x="88" y="202" class="section">主链路：从中台入口到成本树展示与预警处理</text>

  <g filter="url(#shadow)">
    <rect x="1656" y="164" width="214" height="744" rx="22" fill="#ffffff" stroke="#d8e3f2" stroke-width="2"/>
  </g>
  <circle cx="1688" cy="204" r="17" fill="#7c3aed"/>
  <text x="1683" y="210" class="badgeText">9</text>
  <text x="1714" y="211" class="section">治理与运维</text>
  <text x="1716" y="240" class="small">中台能力复用</text>

  <rect x="1684" y="274" width="150" height="44" rx="10" fill="#eff6ff" stroke="#dbeafe"/>
  <circle cx="1706" cy="296" r="7" fill="#2563eb"/>
  <text x="1722" y="302" class="pillText">菜单权限</text>
  <rect x="1684" y="332" width="150" height="44" rx="10" fill="#eff6ff" stroke="#dbeafe"/>
  <circle cx="1706" cy="354" r="7" fill="#2563eb"/>
  <text x="1722" y="360" class="pillText">按钮权限</text>
  <rect x="1684" y="390" width="150" height="44" rx="10" fill="#f0fdf4" stroke="#dcfce7"/>
  <circle cx="1706" cy="412" r="7" fill="#059669"/>
  <text x="1722" y="418" class="pillText">数据权限</text>
  <rect x="1684" y="448" width="150" height="44" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <circle cx="1706" cy="470" r="7" fill="#7c3aed"/>
  <text x="1722" y="476" class="pillText">导入批次</text>
  <rect x="1684" y="506" width="150" height="44" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <circle cx="1706" cy="528" r="7" fill="#ea580c"/>
  <text x="1722" y="534" class="pillText">错误记录</text>
  <rect x="1684" y="564" width="150" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="1706" cy="586" r="7" fill="#64748b"/>
  <text x="1722" y="592" class="pillText">审计日志</text>

  <rect x="1684" y="650" width="150" height="176" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1702" y="681" class="small">支撑能力</text>
  <text x="1702" y="710" class="tiny">统一登录与租户</text>
  <text x="1702" y="735" class="tiny">权限点与角色</text>
  <text x="1702" y="760" class="tiny">导入导出组件</text>
  <text x="1702" y="785" class="tiny">接口审计与追踪</text>
  <text x="1702" y="810" class="tiny">错误清单沉淀</text>

  <!-- Main flow cards -->
  <g filter="url(#shadow)">
    <rect x="82" y="226" width="220" height="170" rx="18" fill="url(#blueSoft)" stroke="#bfdbfe" stroke-width="2"/>
  </g>
  <circle cx="116" cy="264" r="18" fill="#2563eb"/>
  <text x="111" y="270" class="badgeText">1</text>
  <text x="146" y="272" class="cardTitle">用户与中台入口</text>
  <text x="112" y="314" class="cardSub">数据中台菜单</text>
  <text x="112" y="343" class="cardSub">统一登录 / Token</text>
  <text x="112" y="372" class="cardSub">角色权限 / 租户隔离</text>

  <g filter="url(#shadow)">
    <rect x="340" y="226" width="220" height="170" rx="18" fill="url(#blueSoft)" stroke="#bfdbfe" stroke-width="2"/>
  </g>
  <circle cx="374" cy="264" r="18" fill="#2563eb"/>
  <text x="369" y="270" class="badgeText">2</text>
  <text x="404" y="272" class="cardTitle">成本树前端模块</text>
  <text x="370" y="313" class="cardSub">总体展示 / 目录</text>
  <text x="370" y="342" class="cardSub">数据采集 / 成本树</text>
  <text x="370" y="371" class="cardSub">待分配池 / 预警看板</text>

  <g filter="url(#shadow)">
    <rect x="598" y="226" width="220" height="170" rx="18" fill="url(#greenSoft)" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <circle cx="632" cy="264" r="18" fill="#059669"/>
  <text x="627" y="270" class="badgeText">3</text>
  <text x="662" y="272" class="cardTitle">数据采集与维护</text>
  <text x="628" y="313" class="cardSub">项目基本情况</text>
  <text x="628" y="342" class="cardSub">工作令基础信息</text>
  <text x="628" y="371" class="cardSub">草稿 / 提交 / 确认</text>

  <!-- Decision diamond -->
  <g filter="url(#shadow)">
    <path d="M950 208 L1070 318 L950 428 L830 318 Z" fill="url(#orangeSoft)" stroke="#fed7aa" stroke-width="3"/>
  </g>
  <circle cx="950" cy="280" r="18" fill="#ea580c"/>
  <text x="945" y="286" class="badgeText">D</text>
  <text x="950" y="318" class="cardTitle" text-anchor="middle">确认与匹配</text>
  <text x="950" y="350" class="cardSub" text-anchor="middle">提交数据是否确认</text>
  <text x="950" y="378" class="cardSub" text-anchor="middle">源数据是否可匹配</text>

  <g filter="url(#shadow)">
    <rect x="1138" y="226" width="240" height="170" rx="18" fill="url(#purpleSoft)" stroke="#ddd6fe" stroke-width="2"/>
  </g>
  <circle cx="1174" cy="264" r="18" fill="#7c3aed"/>
  <text x="1169" y="270" class="badgeText">5</text>
  <text x="1208" y="272" class="cardTitle">成本项目锚定</text>
  <text x="1168" y="313" class="mono">cost_project</text>
  <text x="1168" y="342" class="cardSub">型号 / 领域 / 系列</text>
  <text x="1168" y="371" class="cardSub">项目状态 / 填报状态</text>

  <!-- Middle row -->
  <g filter="url(#shadow)">
    <rect x="82" y="500" width="260" height="180" rx="18" fill="url(#purpleSoft)" stroke="#ddd6fe" stroke-width="2"/>
  </g>
  <circle cx="118" cy="538" r="18" fill="#7c3aed"/>
  <text x="113" y="544" class="badgeText">4</text>
  <text x="154" y="546" class="cardTitle">源数据接入</text>
  <text x="114" y="589" class="cardSub">主业项目树</text>
  <text x="114" y="618" class="cardSub">工作令项目关联</text>
  <text x="114" y="647" class="cardSub">账面成本明细 / 单位字典</text>

  <g filter="url(#shadow)">
    <rect x="600" y="500" width="300" height="180" rx="18" fill="url(#greenSoft)" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <circle cx="636" cy="538" r="18" fill="#059669"/>
  <text x="631" y="544" class="badgeText">6</text>
  <text x="672" y="546" class="cardTitle">成本汇总与树构建</text>
  <text x="632" y="589" class="mono">cost_model_node</text>
  <text x="632" y="618" class="cardSub">单位聚合 / 阶段筛选</text>
  <text x="632" y="647" class="cardSub">院内 / 院外分类</text>

  <g filter="url(#shadow)">
    <rect x="1080" y="500" width="290" height="180" rx="18" fill="url(#greenSoft)" stroke="#bbf7d0" stroke-width="2"/>
  </g>
  <circle cx="1116" cy="538" r="18" fill="#059669"/>
  <text x="1111" y="544" class="badgeText">7</text>
  <text x="1152" y="546" class="cardTitle">分析、预警与交付</text>
  <text x="1112" y="589" class="cardSub">目标成本 / 账面成本</text>
  <text x="1112" y="618" class="cardSub">超支阈值 / 待分配池</text>
  <text x="1112" y="647" class="cardSub">成本树展示 / 预警处理</text>

  <!-- Error and storage row -->
  <g filter="url(#shadow)">
    <rect x="82" y="735" width="260" height="135" rx="18" fill="url(#orangeSoft)" stroke="#fed7aa" stroke-width="2"/>
  </g>
  <circle cx="118" cy="772" r="18" fill="#ea580c"/>
  <text x="113" y="778" class="badgeText">!</text>
  <text x="154" y="779" class="cardTitle">退回与错误清单</text>
  <text x="114" y="818" class="cardSub">确认退回 / 导入错误</text>
  <text x="114" y="847" class="cardSub">待修正数据沉淀</text>

  <g filter="url(#shadow)">
    <rect x="382" y="735" width="988" height="135" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <circle cx="420" cy="772" r="18" fill="#7c3aed"/>
  <text x="415" y="778" class="badgeText">8</text>
  <text x="456" y="779" class="cardTitle">数据存储层</text>
  <text x="456" y="814" class="small">成本库 MySQL 表，承载项目、工作令、账面明细、单位成本结构、预警记录</text>
  <rect x="456" y="832" width="158" height="28" rx="8" fill="#eff6ff" stroke="#dbeafe"/>
  <text x="474" y="851" class="tiny">cost_project_basic</text>
  <rect x="632" y="832" width="142" height="28" rx="8" fill="#eff6ff" stroke="#dbeafe"/>
  <text x="652" y="851" class="tiny">cost_work_order</text>
  <rect x="792" y="832" width="222" height="28" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="809" y="851" class="tiny">cost_work_order_ledger_detail</text>
  <rect x="1032" y="832" width="172" height="28" rx="8" fill="#ecfdf5" stroke="#bbf7d0"/>
  <text x="1050" y="851" class="tiny">cost_unit_cost_detail</text>
  <rect x="1222" y="832" width="126" height="28" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1236" y="851" class="tiny">cost_warning_record</text>

  <!-- Main arrows -->
  <path d="M302 311 L340 311" stroke="#2563eb" stroke-width="3.2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M560 311 L598 311" stroke="#2563eb" stroke-width="3.2" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M818 311 L830 311" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M1070 318 L1138 318" stroke="#059669" stroke-width="3.2" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="1068" y="281" width="66" height="26" rx="8" fill="#fbfdff" stroke="#dcfce7"/>
  <text x="1078" y="300" class="greenLabel">确认通过</text>

  <!-- Source and matching arrows -->
  <path d="M342 590 C418 552 452 412 596 412 L784 412 C830 412 850 384 878 360" stroke="#7c3aed" stroke-width="2.2" stroke-dasharray="8 8" fill="none" marker-end="url(#arrowGray)" opacity="0.82"/>
  <rect x="408" y="392" width="134" height="28" rx="8" fill="#fbfdff" stroke="#e9d5ff"/>
  <text x="424" y="411" class="small">Excel / 源系统数据</text>
  <path d="M1258 396 L1258 456 L750 456 L750 500" stroke="#059669" stroke-width="3.2" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="1068" y="427" width="128" height="26" rx="8" fill="#fbfdff" stroke="#dcfce7"/>
  <text x="1084" y="445" class="greenLabel">锚定后汇总建树</text>
  <path d="M900 590 L1080 590" stroke="#2563eb" stroke-width="3.2" fill="none" marker-end="url(#arrowBlue)"/>
  <rect x="924" y="552" width="78" height="26" rx="8" fill="#fbfdff" stroke="#dbeafe"/>
  <text x="940" y="570" class="label">成本分析</text>

  <!-- Failure channel, routed below cards -->
  <path d="M950 428 L950 448 L548 448 L548 704 L212 704 L212 735" stroke="#ea580c" stroke-width="3" fill="none" marker-end="url(#arrowOrange)"/>
  <rect x="642" y="688" width="224" height="26" rx="8" fill="#fffdf8" stroke="#fed7aa"/>
  <text x="664" y="706" class="orangeLabel">确认退回 / 匹配失败 / 导入错误</text>
  <path d="M342 802 L382 802" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="8 8" fill="none" marker-end="url(#arrowGray)"/>

  <!-- Storage support lines -->
  <path d="M750 680 L750 735" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M1225 680 L1225 735" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7" fill="none" marker-end="url(#arrowGray)"/>
  <rect x="1248" y="702" width="98" height="24" rx="7" fill="#fbfdff" stroke="#e2e8f0"/>
  <text x="1262" y="718" class="tiny">结果与预警落库</text>

  <!-- Governance support lines, right margin only -->
  <path d="M1656 560 L1500 560 L1500 803 L1370 803" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="7 8" fill="none" marker-end="url(#arrowGray)" opacity="0.72"/>
  <rect x="1498" y="526" width="132" height="24" rx="7" fill="#fbfdff" stroke="#e2e8f0"/>
  <text x="1512" y="542" class="tiny">权限、审计与批次支撑</text>

  <!-- Service label -->
  <rect x="1388" y="502" width="192" height="178" rx="16" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="1422" y="536" class="cardTitle">后端服务</text>
  <text x="1416" y="574" class="mono">yudao-module-cost</text>
  <text x="1416" y="604" class="small">Controller / Service</text>
  <text x="1416" y="632" class="small">Mapper / Import</text>
  <text x="1416" y="660" class="small">权限校验 / 状态流转</text>
  <path d="M1370 590 L1388 590" stroke="#2563eb" stroke-width="2.8" fill="none" marker-end="url(#arrowBlue)"/>

  <!-- Bottom capability bar -->
  <rect x="62" y="928" width="1808" height="86" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="102" y="981" class="section">核心能力</text>
  <rect x="242" y="952" width="154" height="38" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="287" y="977" class="pillText">中台集成</text>
  <rect x="430" y="952" width="164" height="38" rx="16" fill="#ecfdf5" stroke="#bbf7d0"/>
  <text x="474" y="977" class="pillText">双角色填报</text>
  <rect x="628" y="952" width="174" height="38" rx="16" fill="#ecfdf5" stroke="#bbf7d0"/>
  <text x="672" y="977" class="pillText">成本树聚合</text>
  <rect x="836" y="952" width="154" height="38" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="880" y="977" class="pillText">待分配池</text>
  <rect x="1024" y="952" width="154" height="38" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1069" y="977" class="pillText">超支预警</text>
  <rect x="1212" y="952" width="154" height="38" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="1257" y="977" class="pillText">导入导出</text>
  <rect x="1400" y="952" width="154" height="38" rx="16" fill="#faf5ff" stroke="#ddd6fe"/>
  <text x="1445" y="977" class="pillText">权限审计</text>
  <rect x="1588" y="952" width="214" height="38" rx="16" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="1630" y="977" class="pillText">预警处理与回溯</text>
</svg>
